<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mappd: Travel Map Tracker</title>
<meta name="description" content="Color in every country you've been to. Collect stamps, log trips and share your world. An iPhone app by Grillz App Studio.">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>
  /* Layout: one blue screen, the app icon and wordmark centred, a sticker headline, two plain links below. */
  :root {
    --ocean: #3A47FF;
    --ink: #111111;
    --yellow: #FFC93C;
    --pink: #FF6FB5;
    --white: #FFFFFF;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ocean); color: var(--white); font: 17px/1.6 var(--body);
    background-image: radial-gradient(rgba(255,255,255,.16) 1.3px, transparent 1.6px); background-size: 18px 18px;
    display: flex; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding-inline: 20px; padding-block: 56px 32px; gap: 22px; }
  .icon { width: 132px; height: 132px; border-radius: 30px; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
  .word { font: 800 clamp(3rem, 12vw, 4.6rem)/0.9 var(--display); letter-spacing: -0.04em; margin: 0; }
  h1 { font: 800 clamp(1.5rem, 5vw, 2.1rem)/1.15 var(--display); letter-spacing: -0.03em; margin: 0; max-width: 22ch; text-wrap: balance; }
  h1 span { display: inline-block; background: var(--yellow); color: var(--ink); padding: 0 10px 4px; border: 3px solid var(--ink);
    border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg); }
  p { margin: 0; max-width: 36ch; opacity: .92; }
  .soon { font: 800 14px var(--display); letter-spacing: .06em; text-transform: uppercase; background: var(--ink); color: var(--yellow);
    border-radius: 999px; padding: 8px 16px; }
  footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; padding-inline: 20px; padding-block: 18px 32px; font-size: 15px; }
  a { color: var(--white); font-weight: 700; text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; border-radius: 4px; }
  .muted { opacity: .75; font-weight: 400; }
</style>
</head>
<body>
<main>
  <img class="icon" src="/icon.png" alt="mappd app icon" width="132" height="132">
  <p class="word">mappd</p>
  <h1>Color in every country <span>you've been</span></h1>
  <p>Stamp the places you've visited, log your trips year by year and share your world. For iPhone.</p>
  <div class="soon">Coming soon to the App Store</div>
</main>
<footer>
  <a href="/support/">Support</a>
  <a href="/privacy/">Privacy Policy</a>
  <span class="muted">© 2026 Grillz App Studio</span>
</footer>
</body>
</html>
